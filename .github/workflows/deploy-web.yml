# Builds the web version and publishes it to GitHub Pages on every push to main.
name: Web sürümünü yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx expo export --platform web --output-dir dist
      - name: Prepare for GitHub Pages
        run: |
          # Turkish page language + a description for link previews.
          sed -i 's/<html lang="en">/<html lang="tr">/' dist/index.html
          sed -i 's#<title>#<meta name="description" content="Öğrenciler için günlük plan koçu: yapacaklarını yaz, saatli planını al, gün sonunda yarını birlikte ayarlayın." /><title>#' dist/index.html
          # Single-page app: unknown paths (e.g. a refresh on /chat) fall back to the app.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
